<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90" role="img" aria-label="LandMarked">
  <!-- The roundel-aperture. Same ring geometry as pin-venue.svg (r=32,
       stroke 8) so the logo and the map pins are one family. The bar is the
       signage half of the idea — it is what the CSS has been calling the
       wordmark since the roundel pass.

       The bar's overhang is ink: furniture, wayfinding, the part that belongs
       to the system. The span inside the circle is the neighbourhood's
       blended palette — accent, signal, near — because what a place holds
       here is colour. Ends first in source order would be overpainted, so
       the colour stack is drawn first and the ink caps land on top. -->
  <circle cx="45" cy="45" r="32" fill="none" stroke="#17181C" stroke-width="8"/>
  <rect x="0" y="36" width="90" height="6" fill="#E5533D"/>
  <rect x="0" y="42" width="90" height="6" fill="#F8C300"/>
  <rect x="0" y="48" width="90" height="6" fill="#3F7D49"/>
  <rect x="0" y="36" width="11" height="18" fill="#17181C"/>
  <rect x="79" y="36" width="11" height="18" fill="#17181C"/>
</svg>
