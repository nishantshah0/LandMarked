<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <!-- Unclaimed: an open aperture. Dashed ring reads as "nobody has looked
       through this one yet"; the hollow centre invites the photograph.
       Deliberately sparser than the other two — at 30px on a busy map, a
       dashed ring plus ticks plus an iris all merge into a smudge. -->
  <circle cx="45" cy="45" r="33" fill="#F7F5EF"/>
  <circle cx="45" cy="45" r="33" fill="none" stroke="#17181C" stroke-width="7"
          stroke-dasharray="12 10" stroke-linecap="round"/>
  <circle cx="45" cy="45" r="11" fill="none" stroke="#17181C" stroke-width="6"/>
</svg>
