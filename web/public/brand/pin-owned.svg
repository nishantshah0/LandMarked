  <circle cx="45" cy="45" r="33" fill="none" stroke="#17181C" stroke-width="6.5"/>
  <g stroke="#F7F5EF" stroke-width="5" stroke-linecap="round" opacity="0.92">
    <path d="M45 19 v7"/><path d="M71 45 h-7"/><path d="M45 71 v-7"/><path d="M19 45 h7"/>
  </g>
</svg>
