<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <!-- Held: the aperture has closed on a photograph. Solid ring, accent fill,
       centre deliberately clean — the holder's initial renders on top of it. -->
