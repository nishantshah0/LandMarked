services:
  - type: web
    name: seen
    runtime: docker
    # Starter (~$7/mo, cancel after the event) because persistent disks aren't
    # available on Render's free tier — and without the disk, every restart or
    # redeploy wipes the archive, which is the whole product.
    #
    # Truly-free variant: change plan to "free" AND delete the disk block below.
    # Accept that data resets on restart and the service sleeps after ~15 min
    # idle (first visitor then waits ~1 min). Don't redeploy after real people
    # have claimed.
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8787
      # Optional: enables vision verification and question generation. Claude is
      # tried first, Gemini behind it. With neither, claims still pass on the
      # GPS + duplicate-photo checks and are logged as unverified.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Only set these if your key lacks the default model.
      - key: GEMINI_VISION_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FUNFACT_MODEL
        value: gemini-2.5-flash
      # Optional: lets you register a finished 3D model over HTTP mid-event
      # instead of shelling into the box. Any long random string.
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: seen-data
      mountPath: /app/data
      sizeGB: 1
