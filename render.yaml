services:
  - type: web
    name: seen
    runtime: docker

    # Starter (~$7/mo, cancellable after the event) because it is the cheapest
    # plan with a persistent disk. Free has no disk, which would make the photo
    # archive reset on every restart or spin-down — and a permanent archive is
    # the entire premise of this project, not a nice-to-have.
    plan: starter

    healthCheckPath: /healthz

    envVars:
      - key: PORT
        value: 8787
      # tsx compiles TypeScript at runtime; cap the heap under the instance's
      # 512 MB so a spike is a tidy GC rather than an OOM kill. Measured steady
      # state is ~120 MB, so this is headroom, not a squeeze.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Optional: enables vision verification and question generation. Claude is
      # tried first, Gemini behind it. With neither, claims still pass on the
      # GPS + duplicate-photo checks and are logged as unverified.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Only set these if your key lacks the default model.
      - key: GEMINI_VISION_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FUNFACT_MODEL
        value: gemini-2.5-flash
      # Optional: lets you attach a 3D model over HTTP mid-event instead of
      # shelling into the box. Any long random string.
      - key: ADMIN_TOKEN
        sync: false

    # The archive: sqlite, photographs, and 3D models. Landmarks do not depend
    # on this — seed/landmarks.db is baked into the image and copied onto the
    # disk on first boot — but every claim anyone makes does.
    disk:
      name: seen-data
      mountPath: /app/data
      sizeGB: 1
